services:
  # ── Static frontend ────────────────────────────────────────────────────────
  - type: web
    name: base-minesweeper
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CONTRACT_ADDRESS
        sync: false
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: VITE_CHAIN_ID
        value: "84532"
      # Optional: Alchemy API key only — app builds Base Sepolia/Mainnet RPC URLs. Prefer over VITE_RPC_URL.
      - key: VITE_ALCHEMY_API_KEY
        sync: false
      # Optional: full RPC URL override (if not using VITE_ALCHEMY_API_KEY)
      - key: VITE_RPC_URL
        sync: false
